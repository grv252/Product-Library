<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maybank Wealth — Product Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-0:#000000; --ink-1:#111114; --ink-2:#1a1a1f; --ink-3:#2a2a31;
    --ink-4:#4a4a55; --ink-5:#6b6b78; --ink-6:#9a9aa6; --ink-7:#c8c8d0;
    --ink-8:#e6e6ec; --ink-9:#f1f1f4;
    --pink:#e2015b; --pink-ink:#b30148; --pink-soft:#ffeaf2;
    --lime:#cddd00; --lime-soft:#f6fac2;
    --blue:#334fa4; --blue-ink:#1f3478; --blue-soft:#e6ecfa;
    --teal:#0d8a8a; --teal-soft:#d8f0f0;
    --white:#ffffff; --ok:#1e8a5a; --ok-soft:#e3f5ec;
    --danger:#c8313a; --danger-soft:#fadcde;
    --amber:#b7791f; --amber-soft:#fdf0d8;
    --green-i:#1a7a4a; --green-i-soft:#dff3e8;
    --paper:#f4f4f6;
    --r-xs:4px; --r-md:10px; --r-lg:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Poppins',-apple-system,sans-serif;background:var(--paper);color:var(--ink-1);font-size:13px}
  .num{font-family:'JetBrains Mono',monospace;font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
  .app{display:flex;min-height:100vh}

  /* ── sidebar product navigator ── */
  .nav{width:268px;background:#fff;color:var(--ink-1);flex-shrink:0;padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--ink-8)}
  .nav-logo{display:flex;align-items:center;gap:9px;padding:0 20px 16px;border-bottom:1px solid var(--ink-8)}
  .nav-logo .lg{background:var(--lime);color:#000;font-weight:800;font-size:13px;padding:4px 9px;border-radius:5px}
  .nav-logo .sub{font-size:11px;color:var(--ink-6)}
  .nav-sec{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-6);padding:16px 20px 7px;font-weight:600}
  .nav-item{padding:9px 20px;cursor:pointer;border-left:2.5px solid transparent;display:flex;align-items:center;gap:10px;transition:background 120ms}
  .nav-item:hover{background:var(--ink-9)}
  .nav-item.active{background:var(--ink-9);border-left-color:var(--ink-1)}
  .nav-item .ni-num{width:22px;height:22px;border-radius:50%;background:var(--ink-9);color:var(--ink-5);
    border:1px solid var(--ink-8);display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;flex-shrink:0}
  .nav-item.active .ni-num{background:var(--ink-1);color:#fff;border-color:var(--ink-1)}
  .nav-item .ni-nm{font-size:12.5px;font-weight:500;color:var(--ink-1)}
  .nav-item .ni-ct{font-size:10.5px;color:var(--ink-6);margin-top:1px}
  .nav-item.active .ni-nm{color:var(--ink-1);font-weight:600}

  /* ── main ── */
  .main{flex:1;padding:22px 28px;max-width:1180px}
  .crumb{font-size:12px;color:var(--ink-5);margin-bottom:14px;display:flex;gap:7px;flex-wrap:wrap}
  .crumb .cur{color:var(--ink-2);font-weight:500}

  .prod-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}
  .prod-title{font-size:21px;font-weight:700;letter-spacing:-0.01em;color:var(--ink-0);margin-bottom:8px;max-width:640px}
  .prod-tags{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .countdown{background:var(--ink-0);color:#fff;border-radius:var(--r-md);padding:11px 17px;text-align:center;min-width:142px;flex-shrink:0}
  .hd-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0}
  .btn-elig{background:var(--pink);color:#fff;border:none;border-radius:var(--r-md);
    padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Poppins',sans-serif;
    display:inline-flex;align-items:center;gap:7px;box-shadow:0 1px 0 rgba(0,0,0,.05),inset 0 -1.5px 0 rgba(0,0,0,.18);
    transition:transform 80ms}
  .btn-elig:hover{transform:translateY(-1px)}
  .countdown .cd-lbl{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-6)}
  .countdown .cd-val{font-size:22px;font-weight:700;color:var(--lime);margin:2px 0}
  .countdown .cd-sub{font-size:10px;color:var(--ink-7)}

  .tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.07em;
    text-transform:uppercase;padding:3px 7px;border-radius:var(--r-xs);background:var(--ink-9);color:var(--ink-3);line-height:1.4}
  .tag.blue{background:var(--blue-soft);color:var(--blue-ink)}
  .tag.danger{background:var(--danger-soft);color:var(--danger)}
  .tag.lime{background:var(--lime-soft);color:#5e6700}
  .tag.dark{background:var(--ink-1);color:var(--lime)}
  .tag.amber{background:var(--amber-soft);color:var(--amber)}
  .tag.ok{background:var(--ok-soft);color:var(--ok)}
  .tag.teal{background:var(--teal-soft);color:var(--teal)}
  .tag.green-i{background:var(--green-i-soft);color:var(--green-i)}

  .grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
  .col{display:flex;flex-direction:column;gap:16px}
  .panel{background:#fff;border:1px solid var(--ink-8);border-radius:var(--r-lg);overflow:hidden}
  .panel-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 17px;border-bottom:1px solid var(--ink-9);gap:12px}
  .panel-hd h3{font-size:13px;font-weight:600;color:var(--ink-1)}
  .panel-bd{padding:15px 17px}
  .meta{font-size:11px;color:var(--ink-5);display:flex;align-items:center;gap:6px}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:500;font-size:13px;
    padding:8px 14px;border-radius:var(--r-md);cursor:pointer;border:none;font-family:'Poppins',sans-serif;transition:transform 80ms}
  .btn:hover{transform:translateY(-1px)}
  .btn-sm{font-size:12px;padding:6px 11px}
  .btn-primary{background:var(--pink);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.05),inset 0 -1.5px 0 rgba(0,0,0,.18)}
  .btn-ghost{background:transparent;color:var(--ink-3);border:1px solid var(--ink-8)}
  .btn-dark{background:var(--ink-1);color:#fff}
  .btn-block{width:100%}

  /* metric row */
  .mrow{display:grid;gap:1px;background:var(--ink-8);border-radius:var(--r-md);overflow:hidden;margin-bottom:15px}
  .mcell{background:#fff;padding:12px 14px}
  .mcell .pl{font-size:10px;color:var(--ink-5);text-transform:uppercase;letter-spacing:.04em}
  .mcell .pv{font-size:18px;font-weight:700;margin-top:3px}
  .mcell .pd{font-size:11px;margin-top:2px}
  .up{color:var(--ok)} .down{color:var(--pink)}

  /* terms */
  .terms{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
  .term{padding:9px 2px;border-bottom:1px solid var(--ink-9);display:flex;justify-content:space-between;gap:8px}
  .term .tl{font-size:11.5px;color:var(--ink-5)}
  .term .tv{font-size:12.5px;font-weight:600;text-align:right}

  /* eligibility */
  .elig-item{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--ink-9)}
  .elig-item:last-child{border-bottom:none}
  .elig-ic{width:19px;height:19px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;
    align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:700}
  .elig-tx{font-size:12px} .elig-tx b{font-weight:600} .elig-tx .sub{color:var(--ink-5);font-size:11px}

  /* docs */
  .doc{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--ink-8);border-radius:var(--r-md);margin-bottom:7px;cursor:pointer}
  .doc:hover{background:var(--ink-9)}
  .doc-ic{width:28px;height:28px;border-radius:6px;background:var(--pink-soft);color:var(--pink);display:flex;
    align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700}
  .doc-nm{font-size:12px;font-weight:500} .doc-mt{font-size:10px;color:var(--ink-5)}

  /* shariah callout */
  .shariah{background:var(--green-i-soft);border:1px solid #b5dcc6;border-radius:var(--r-md);padding:11px 13px;margin-bottom:14px;display:flex;gap:10px}
  .shariah .si{font-size:18px}
  .shariah .st{font-size:11.5px;color:var(--green-i);line-height:1.5}
  .shariah .st b{font-weight:600}

  /* cta */
  .cta-wrap{background:linear-gradient(135deg,#1a1a1f,#000);border-radius:var(--r-lg);padding:17px;color:#fff}
  .cta-wrap h4{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:7px}
  .cta-wrap p{font-size:11.5px;color:var(--ink-7);margin-bottom:12px;line-height:1.5}

  /* perf table */
  .perf{width:100%;border-collapse:collapse}
  .perf th{font-size:10px;color:var(--ink-5);text-transform:uppercase;letter-spacing:.04em;text-align:right;padding:6px 8px;font-weight:600;border-bottom:1px solid var(--ink-8)}
  .perf th:first-child{text-align:left}
  .perf td{font-size:12px;text-align:right;padding:8px;border-bottom:1px solid var(--ink-9)}
  .perf td:first-child{text-align:left;font-weight:500}

  /* allocation bars */
  .alloc-row{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .alloc-nm{font-size:11.5px;width:120px;flex-shrink:0;color:var(--ink-3)}
  .alloc-bar{flex:1;height:8px;background:var(--ink-9);border-radius:4px;overflow:hidden}
  .alloc-bar i{display:block;height:100%}
  .alloc-pct{font-size:11.5px;font-weight:600;width:42px;text-align:right}
  .holding{display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;border-bottom:1px solid var(--ink-9)}

  /* rate ladder */
  .ladder{width:100%;border-collapse:collapse}
  .ladder th{font-size:10px;color:var(--ink-5);text-transform:uppercase;padding:7px 10px;text-align:center;border-bottom:1px solid var(--ink-8);font-weight:600}
  .ladder th:first-child{text-align:left}
  .ladder td{font-size:12.5px;padding:9px 10px;text-align:center;border-bottom:1px solid var(--ink-9)}
  .ladder td:first-child{text-align:left;font-weight:500}
  .ladder td.best{background:var(--lime-soft);font-weight:700;color:#5e6700}

  /* coupon schedule */
  .cpn{display:flex;gap:0;margin-top:4px;position:relative}
  .cpn-step{flex:1;text-align:center;position:relative;padding-top:22px}
  .cpn-step::before{content:"";position:absolute;top:6px;left:0;right:0;height:2px;background:var(--ink-8)}
  .cpn-step:first-child::before{left:50%}
  .cpn-step:last-child::before{right:50%}
  .cpn-dot{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--blue)}
  .cpn-dot.paid{background:var(--ok);box-shadow:0 0 0 1px var(--ok)}
  .cpn-d{font-size:10px;color:var(--ink-5)} .cpn-v{font-size:11px;font-weight:600;margin-top:1px}

  /* DCI scenario */
  .scenario{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .scen{border:1px solid var(--ink-8);border-radius:var(--r-md);padding:12px}
  .scen.up-s{border-left:3px solid var(--ok)} .scen.dn-s{border-left:3px solid var(--amber)}
  .scen-h{font-size:11px;font-weight:700;margin-bottom:5px}
  .scen-b{font-size:11px;color:var(--ink-4);line-height:1.5}

  /* takaful split */
  .split-bar{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:8px 0}
  .split-bar .sp{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600}
  .benefit-chart{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:8px}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
  .bcol .bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--teal),#5cc)}
  .bcol .bl{font-size:9px;color:var(--ink-5)}

  /* dividend bars */
  .divs{display:flex;align-items:flex-end;gap:8px;height:100px;margin-top:6px}
  .dcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
  .dcol .bar{width:100%;border-radius:3px 3px 0 0;background:var(--green-i)}
  .dcol .dv{font-size:10px;font-weight:600;color:var(--green-i)} .dcol .dl{font-size:9.5px;color:var(--ink-5)}

  /* drawer (same as before, condensed) */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:100;backdrop-filter:blur(2px)}
  .overlay.show{display:flex;justify-content:flex-end}
  .drawer{width:720px;max-width:94vw;background:var(--paper);height:100%;overflow-y:auto;animation:slide .25s ease}
  @keyframes slide{from{transform:translateX(40px);opacity:.6}to{transform:translateX(0);opacity:1}}
  .drawer-hd{position:sticky;top:0;background:var(--ink-0);color:#fff;padding:17px 22px;z-index:2}
  .drawer-hd h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
  .drawer-hd .close{background:rgba(255,255,255,.12);border:none;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;float:right}
  .drawer-hd .dh-sub{font-size:11.5px;color:var(--ink-7);margin-top:6px;line-height:1.5;max-width:540px}
  .drawer-stats{display:flex;gap:20px;margin-top:13px}
  .dstat .dn{font-size:19px;font-weight:700;color:var(--lime)} .dstat .dl{font-size:9.5px;color:var(--ink-6);text-transform:uppercase}
  .drawer-body{padding:17px 22px}
  .cl-card{background:#fff;border:1px solid var(--ink-8);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
  .cl-card.flagged{border-left:3px solid var(--amber)}
  .cl-rank{width:25px;height:25px;border-radius:50%;background:var(--ink-9);color:var(--ink-3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
  .cl-rank.top{background:var(--pink);color:#fff}
  .cl-name{font-size:13px;font-weight:600} .cl-tags{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
  .cl-detail{font-size:10.5px;color:var(--ink-5);margin-top:4px;display:flex;gap:11px;flex-wrap:wrap}
  .cl-detail b{color:var(--ink-2)}
  .cl-prop{text-align:center;min-width:70px} .cl-prop .score{font-size:20px;font-weight:700;line-height:1}
  .cl-prop .plabel{font-size:8.5px;color:var(--ink-5);text-transform:uppercase;margin-top:2px}
  .propbar{height:4px;background:var(--ink-9);border-radius:3px;margin-top:5px;overflow:hidden}.propbar i{display:block;height:100%;background:var(--pink)}
  .warn-line{font-size:10px;color:var(--amber);margin-top:4px;font-weight:600}
  .hist-line{font-size:10px;color:var(--ink-5);margin-top:3px}

  .framework-note{background:#fff;border:1px dashed var(--ink-7);border-radius:var(--r-md);padding:10px 13px;margin-bottom:16px;font-size:11.5px;color:var(--ink-4);line-height:1.5}
  .framework-note b{color:var(--ink-1)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<div class="app">
  <!-- ─── PRODUCT NAVIGATOR ─── -->
  <div class="nav">
    <div class="nav-sec">Market-Linked</div>
    <div id="nav-list"></div>
  </div>

  <!-- ─── MAIN RENDER TARGET ─── -->
  <div class="main" id="main"></div>
</div>

<!-- ─── ELIGIBLE CLIENTS DRAWER ─── -->
<div class="overlay" id="overlay">
  <div class="drawer">

</div>

    const s=document.createElement('div');s.className='nav-sec';s.textContent='Capital-Stable';navList.appendChild(s);fixedSecAdded=true;
  }
  const el=document.createElement('div');
  el.className='nav-item'+(i===0?' active':'');

  el.innerHTML=`<span class="ni-num">${i+1}</span>
    <div><div class="ni-nm">${p.navName}</div><div class="ni-ct">${p.navCt}</div></div>`;
  el.onclick=()=>{document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));el.classList.add('active');render(p);window.scrollTo(0,0);};
  navList.appendChild(el);
});

/* ── open a sample PDF for a clicked product document ── */
function openDoc(docIndex){
  const p=currentProduct;
  if(!p) return;
  const d=p.docs[docIndex];          // [icon, title, meta]
  const docTitle=d[1], docMeta=d[2];

  const { jsPDF }=window.jspdf;
  const doc=new jsPDF({unit:'pt',format:'a4'});
  const W=doc.internal.pageSize.getWidth();
  const M=48;
  let y=0;

  // header band
  doc.setFillColor(27,43,75); doc.rect(0,0,W,84,'F');        // navy
  doc.setFillColor(245,166,35); doc.rect(0,84,W,4,'F');      // gold accent
  doc.setFillColor(245,166,35); doc.roundedRect(M,30,86,26,3,3,'F');
  doc.setTextColor(27,43,75); doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('Maybank',M+10,48);
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text(docTitle,W-M,42,{align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(174,187,212);
  doc.text('Maybank Wealth Management  ·  '+docMeta,W-M,60,{align:'right'});

  y=120;
  // product name
  doc.setTextColor(27,43,75); doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text(doc.splitTextToSize(p.title,W-2*M),M,y); y+=10+14*Math.ceil(doc.getTextWidth(p.title)/(W-2*M));
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(107,107,120);
  doc.text(p.cat+'  ·  Document type: '+docTitle,M,y); y+=24;

  // intro line
  doc.setDrawColor(220,224,227); doc.line(M,y,W-M,y); y+=20;
  doc.setTextColor(31,41,55); doc.setFont('helvetica','normal'); doc.setFontSize(10);
  const intro='This document provides indicative information on '+p.title+', a '+p.cat
    +' offered through Maybank Wealth Management. The contents below are sample text generated for a '
    +'proof-of-concept demonstration and do not constitute an offer, advice, or actual product disclosure.';
  doc.splitTextToSize(intro,W-2*M).forEach(l=>{doc.text(l,M,y);y+=14;}); y+=10;

  // key terms section
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(27,43,75);
  doc.text('Key Product Terms',M,y); y+=8;
  doc.setDrawColor(245,166,35); doc.setLineWidth(1.5); doc.line(M,y,M+90,y); doc.setLineWidth(1); y+=16;
  doc.setFontSize(9.5);
  p.terms.forEach(t=>{
    doc.setFont('helvetica','bold'); doc.setTextColor(27,43,75); doc.text(t[0],M,y);
    doc.setFont('helvetica','normal'); doc.setTextColor(31,41,55);
    doc.text(doc.splitTextToSize(String(t[1]),W-M-220),M+200,y);
    y+=15;
    if(y>740){doc.addPage();y=60;}
  });
  y+=12;

  // document-specific note
  if(y>680){doc.addPage();y=60;}
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(27,43,75);
  doc.text('About this document',M,y); y+=8;
  doc.setDrawColor(245,166,35); doc.setLineWidth(1.5); doc.line(M,y,M+90,y); doc.setLineWidth(1); y+=16;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(31,41,55);
  const note=DOC_BLURB(docTitle,p);
  doc.splitTextToSize(note,W-2*M).forEach(l=>{doc.text(l,M,y);y+=14; if(y>760){doc.addPage();y=60;}});

  // footer
  doc.setDrawColor(220,224,227); doc.line(M,800,W-M,800);
  doc.setFontSize(7); doc.setTextColor(150,150,150);
  doc.text('Sample document for POC demonstration only — not a real offer or disclosure. © Maybank Berhad (Confidential).',M,814);

  window.open(doc.output('bloburl'),'_blank');
}

/* sample body text per document type */
function DOC_BLURB(title,p){
  const t=title.toLowerCase();
  if(t.includes('term sheet')) return 'This term sheet sets out the indicative commercial terms of the product, including the underlying, tenor, coupon/profit structure, strike and barrier levels (where applicable), observation and settlement dates. Final terms are confirmed at trade execution. Investors should read this together with the Product Highlight Sheet and Risk Disclosure before investing.';
  if(t.includes('highlight')||t.includes('disclosure sheet')) return 'This Product Highlight Sheet is a standardised disclosure prepared in line with Securities Commission Malaysia guidelines. It summarises the product\u2019s nature, suitability, key features, key risks, fees and charges, and eligibility so that investors can make an informed decision. Please seek clarification from your Relationship Manager if any part is unclear.';
  if(t.includes('risk')) return 'This Risk Disclosure Statement describes the principal risks of the product, including market risk, credit/issuer risk, liquidity risk, and (where relevant) currency conversion and capital-loss risk below the protection barrier. Investors acknowledge they understand and accept these risks prior to subscription.';
  if(t.includes('memorandum')||t.includes('prospectus')) return 'This information memorandum / prospectus provides the full disclosure on the issuer, the offering structure, use of proceeds, terms and conditions, fees, taxation and the rights of holders. It is the master legal document governing the product and should be read in full.';
  if(t.includes('fact sheet')) return 'This fund fact sheet summarises the fund\u2019s objective, asset allocation, top holdings, historical performance versus benchmark, fees and risk rating as at the latest valuation date. Past performance is not indicative of future results.';
  if(t.includes('shariah')||t.includes('pronouncement')||t.includes('concept')) return 'This document evidences the Shariah compliance of the product. It sets out the underlying Shariah contract (e.g. Murabahah, Tawarruq, Tabarru\u2019/Wakalah), the basis of profit (which is a profit rate and not interest), and the endorsement of the Shariah Committee. Any non-compliant income is purified in accordance with the Shariah governance framework.';
  if(t.includes('pricing supplement')) return 'This pricing supplement details the coupon, call schedule, redemption mechanics and day-count conventions applicable to this specific series, to be read together with the base information memorandum.';
  if(t.includes('benefit illustration')) return 'This benefit illustration shows projected, non-guaranteed values of the plan over time at the stated illustration rate, including the protection sum covered, the allocation between protection and investment, and the projected maturity benefit. Actual values may differ.';
  if(t.includes('terms')) return 'These terms and conditions govern the account/placement, including profit calculation, tenor options, early-withdrawal treatment, auto-renewal and PIDM protection where applicable.';
  return 'This document provides supporting disclosure for the product. The text shown here is sample content generated for demonstration purposes.';
}
